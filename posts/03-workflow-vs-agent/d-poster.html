<!doctype html>
<meta charset="utf-8">
<title>Workflow vs agent · D · Poster</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=IBM+Plex+Mono:wght@500&family=Sora:wght@400;600;800&display=swap">
<style>
/* D · Poster: one big statement on a solid colour field. 1080x1350 (4:5). Smallest text 26px. */
:root { --field: #1f3cff; --cream: #f6f1e7; --lime: #d4ff4f; --soft: #b9c3ff; }
body { margin: 0; background: var(--field); color: var(--cream); font-family: Sora, sans-serif; }
.art { position: relative; width: 1080px; height: 1350px; overflow: hidden; padding: 64px; box-sizing: border-box; }
.ic { display: inline-block; width: 1em; height: 1em; flex: none; background: currentColor; -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; }
.label { display: flex; justify-content: space-between; font: 500 28px "IBM Plex Mono", monospace; letter-spacing: .08em; }
.big { margin-top: 60px; font: 800 118px/.98 Sora; letter-spacing: -.05em; }
.big span { color: var(--lime); }
.chart { margin-top: 56px; display: flex; align-items: center; gap: 14px; font: 600 32px Sora; }
.chart b { background: var(--cream); color: var(--field); padding: 12px 20px; border-radius: 14px; }
.chart .ic { font-size: 40px; color: var(--lime); }
.rows { margin-top: 48px; display: grid; gap: 16px; }
.rows div { display: grid; grid-template-columns: 260px 1fr; font-size: 32px; line-height: 1.3; }
.rows b { font: 500 30px "IBM Plex Mono", monospace; color: var(--lime); }
.end { position: absolute; left: 64px; right: 64px; bottom: 150px; display: flex; align-items: center; gap: 26px; padding-top: 30px; border-top: 3px solid var(--cream); }
.end img { width: 104px; height: 104px; border-radius: 50%; flex: none; }
.end p { margin: 0; font: 600 32px/1.3 Sora; }
.foot { position: absolute; left: 64px; right: 64px; bottom: 50px; display: flex; align-items: baseline; justify-content: space-between; }
.sig { font: 400 56px Chewy, cursive; }
.foot span:last-child { font: 500 26px "IBM Plex Mono", monospace; color: var(--soft); }
</style>

<div class="art">
  <div class="label"><span>WORKFLOW VS AGENT</span><span>03</span></div>
  <div class="big">If you can draw the flowchart, <span>you don't need an agent.</span></div>
  <div class="chart">
    <b>classify</b><i class="ic" style="--i: url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/arrow-right.svg)"></i>
    <b>route</b><i class="ic" style="--i: url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/arrow-right.svg)"></i>
    <b>reply</b>
  </div>
  <div class="rows">
    <div><b>WORKFLOW</b>you decide the steps</div>
    <div><b>AGENT</b>the AI decides the steps</div>
  </div>
  <div class="end">
    <img src="https://api.dicebear.com/9.x/micah/svg?seed=Kai&backgroundColor=d4ff4f" alt="">
    <p>Save agents for open-ended work, where you can't predict the steps.</p>
  </div>
  <div class="foot"><span class="sig">nifail</span><span>Avatars: Micah by Micah Lanier</span></div>
</div>
