<!doctype html>
<meta charset="utf-8">
<title>TuJu · Q · Phone-native</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Q · Phone-native: the slide is an iPhone Notes screen. Status bar, Notes nav, the note typed in a system-like
   sans, a real App Store screenshot pasted in as an attachment, Notes toolbar. No device frame. 1080x1350. */
:root { --acc: #e3a008; --ink: #111; --grey: #8a8a8e; }
body { margin: 0; background: #999; }
.slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #fff; font-family: Inter, -apple-system, sans-serif; color: var(--ink); }
.ic { display: inline-block; width: 1em; height: 1em; flex: none; background: currentColor; -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; }
.status { position: absolute; left: 70px; right: 60px; top: 26px; display: flex; align-items: center; font: 700 36px Inter; }
.status .r { margin-left: auto; display: flex; gap: 14px; font-size: 36px; }
.nav { position: absolute; left: 40px; right: 50px; top: 98px; display: flex; align-items: center; color: var(--acc); font: 500 40px Inter; }
.nav .ic { font-size: 50px; }
.nav .r { margin-left: auto; display: flex; gap: 34px; font-size: 46px; }
.date { position: absolute; left: 0; right: 0; top: 176px; text-align: center; font: 500 28px Inter; color: var(--grey); }
.note { position: absolute; left: 64px; right: 64px; top: 222px; }
.note h1 { margin: 0; font: 800 70px/1.04 Inter; letter-spacing: -.025em; }
.note p { margin: 20px 0 0; font: 400 38px/1.38 Inter; }
.note p b { font-weight: 700; }
.att { margin-top: 22px; border-radius: 18px; overflow: hidden; border: 2px solid #e6e6ea; }
.att img { display: block; width: 100%; }
.tool { position: absolute; left: 0; right: 0; bottom: 0; height: 130px; border-top: 1px solid #e6e6ea; display: flex; justify-content: space-around; align-items: center; color: var(--acc); font-size: 50px; padding-bottom: 24px; box-sizing: border-box; background: #fafafa; }
.home { position: absolute; left: 50%; bottom: 14px; width: 300px; height: 10px; margin-left: -150px; border-radius: 5px; background: #111; }
.sig { font: 400 54px Chewy, cursive; }
</style>

<div class="slide">
  <div class="status">10:19<span class="r">
    <i class="ic" style="--i: url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/signal.svg)"></i>
    <i class="ic" style="--i: url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/wifi.svg)"></i>
    <i class="ic" style="--i: url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/battery-full.svg)"></i></span></div>
  <div class="nav"><i class="ic" style="--i: url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/chevron-left.svg)"></i>Notes<span class="r">
    <i class="ic" style="--i: url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/share.svg)"></i>
    <i class="ic" style="--i: url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/circle-ellipsis.svg)"></i></span></div>
  <div class="date">26 October 2026 at 10:19</div>

  <div class="note">
    <h1>TuJu, the Waze replacement, rated by Malaysians</h1>
    <p><b>Google Play:</b> 1.2★ (4.9K reviews)<br><b>App Store:</b> 1.3★ (1.9K ratings)</p>
    <p>Top complaint, in their words:</p>
    <div class="att"><img src="../assets/as-6.png" alt="App Store review: Promising concept, but launched way too early"></div>
    <p>Swipe for the rest → <span class="sig">nifail</span></p>
  </div>

  <div class="tool">
    <i class="ic" style="--i: url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/list-checks.svg)"></i>
    <i class="ic" style="--i: url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/paperclip.svg)"></i>
    <i class="ic" style="--i: url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/pen-tool.svg)"></i>
    <i class="ic" style="--i: url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/square-pen.svg)"></i>
  </div>
  <div class="home"></div>
</div>
