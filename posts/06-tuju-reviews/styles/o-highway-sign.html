<!doctype html>
<meta charset="utf-8">
<title>TuJu · O · Highway sign</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Overpass:wght@600;800;900&display=swap">
<style>
/* O · Highway sign: an expressway gantry. Green JKR-style sign panels, white Overpass (a Highway Gothic cut),
   brown tourist sign for the signature. Flat colours, no gradients. 1080x1350. */
:root { --sky: #c9dbe4; --green: #0d6b3c; --steel: #8b9096; --asphalt: #3a3c3f; --brown: #6a3b1e; }
body { margin: 0; background: #999; }
.slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--sky); font-family: Overpass, sans-serif; color: #fff; }
.ic { display: inline-block; width: 1em; height: 1em; flex: none; background: currentColor; -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; }
.post { position: absolute; top: 0; width: 34px; background: var(--steel); }
.beam { position: absolute; left: 0; right: 0; height: 26px; background: var(--steel); }
.sign { position: absolute; background: var(--green); border-radius: 22px; box-shadow: inset 0 0 0 8px var(--green), inset 0 0 0 14px #fff; padding: 46px 52px; box-sizing: border-box; }
.sign h1 { margin: 0; font: 900 82px/.98 Overpass; letter-spacing: -.01em; }
.tab { display: inline-block; background: #fff; color: var(--green); font: 900 34px/1 Overpass; padding: 10px 18px 6px; border-radius: 8px; margin-bottom: 26px; }
.rule { height: 8px; background: #fff; border-radius: 4px; margin: 26px 0 22px; }
.row { display: flex; align-items: center; gap: 22px; font: 800 58px/1 Overpass; }
.row + .row { margin-top: 18px; }
.row .ic { font-size: 62px; }
.row .v { margin-left: auto; font-weight: 900; }
.row small { font: 600 32px Overpass; opacity: .85; margin-left: 12px; }
.dest { display: flex; align-items: center; gap: 24px; font: 900 96px/1 Overpass; }
.dest .ic { font-size: 100px; }
.nores { display: inline-block; margin-top: 18px; background: #fff; color: #111; font: 800 44px/1 Overpass; padding: 14px 20px 8px; border-radius: 8px; }
.quote { position: absolute; left: 380px; right: 240px; top: 1120px; font: 600 26px/1.35 Overpass; color: #1d2a33; }
.road { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: var(--asphalt); }
.road::before { content: ""; position: absolute; left: 0; right: 0; top: 56px; height: 10px; background: repeating-linear-gradient(90deg, #fff 0 90px, transparent 90px 170px); }
.road::after { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 8px; background: #f2c230; }
.brown { position: absolute; left: 70px; bottom: 150px; background: var(--brown); border-radius: 12px; box-shadow: inset 0 0 0 5px var(--brown), inset 0 0 0 9px #fff; padding: 10px 30px 4px; font: 400 64px Chewy, cursive; }
.brown + .stub { position: absolute; left: 160px; bottom: 120px; width: 18px; height: 34px; background: var(--steel); }
.swipe { position: absolute; right: 70px; bottom: 140px; color: #1d2a33; font: 800 30px Overpass; letter-spacing: .08em; }
</style>

<div class="slide">
  <div class="post" style="left: 30px; height: 1230px"></div>
  <div class="post" style="right: 30px; height: 1230px"></div>
  <div class="beam" style="top: 120px"></div>
  <div class="beam" style="top: 790px"></div>

  <div class="sign" style="left: 74px; right: 74px; top: 160px; height: 615px; padding-top: 40px">
    <div class="tab">TUJU</div>
    <h1>TuJu, the Waze replacement, rated by Malaysians</h1>
    <div class="rule"></div>
    <div class="row"><i class="ic" style="--i: url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/arrow-up.svg)"></i>Google Play<small>4.9K reviews</small><span class="v">1.2★</span></div>
    <div class="row"><i class="ic" style="--i: url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/arrow-up-right.svg)"></i>App Store<small>1.9K ratings</small><span class="v">1.3★</span></div>
  </div>

  <div class="sign" style="left: 380px; right: 74px; top: 830px; height: 270px; padding: 40px 48px">
    <div class="dest"><i class="ic" style="--i: url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/arrow-up-right.svg)"></i>KLCC</div>
    <span class="nores">No results found</span>
  </div>
  <div class="quote">"Cari klcc pun tak kuar result." App Store review, 21 Oct</div>

  <div class="brown">nifail</div><div class="stub"></div>
  <div class="road"></div>
  <div class="swipe">SWIPE →</div>
</div>
