<!doctype html>

<title>The $20 AI plan · D · Poster</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=IBM+Plex+Mono:wght@500&family=Sora:wght@400;600;800&display=swap">
<style>
/* D · Poster: one big number story on a solid colour field. 1080x1350 (4:5). Smallest text 26px. */
:root { --field: #1f3cff; --cream: #f6f1e7; --lime: #d4ff4f; --soft: #b9c3ff; }
body { margin: 0; background: var(--field); color: var(--cream); font-family: Sora, sans-serif; }
.art { position: relative; width: 1080px; height: 1350px; overflow: hidden; padding: 64px; box-sizing: border-box; }
.label { display: flex; justify-content: space-between; font: 500 28px "IBM Plex Mono", monospace; letter-spacing: .08em; }
.n { margin-top: 40px; font: 800 400px/.9 Sora; letter-spacing: -.06em; color: var(--lime); }
.what { margin-top: 18px; font: 800 70px/1.06 Sora; letter-spacing: -.03em; }
.what span { color: var(--soft); }
.rows { margin-top: 44px; display: grid; gap: 16px; }
.rows div { display: grid; grid-template-columns: 250px 1fr; font-size: 32px; line-height: 1.3; }
.rows b { font: 500 30px "IBM Plex Mono", monospace; color: var(--lime); }
.end { position: absolute; left: 64px; right: 64px; bottom: 150px; display: flex; align-items: center; gap: 26px; padding-top: 30px; border-top: 3px solid var(--cream); }
.end img { width: 104px; height: 104px; border-radius: 50%; flex: none; }
.end p { margin: 0; font: 800 44px/1.15 Sora; letter-spacing: -.02em; }
.end p span { color: var(--lime); }
.foot { position: absolute; left: 64px; right: 64px; bottom: 50px; display: flex; align-items: baseline; justify-content: space-between; }
.sig { font: 400 56px Chewy, cursive; }
.foot span:last-child { font: 500 26px "IBM Plex Mono", monospace; color: var(--soft); }
</style>

<div class="art">
  <div class="label"><span>THE REAL COST OF AI PLANS</span><span>04</span></div>
  <div class="n">$20</div>
  <div class="what">is a gym membership <span>for AI.</span></div>
  <div class="rows">
    <div><b>LIGHT USERS</b>pay for more than they use</div>
    <div><b>HEAVY USERS</b>use far more than they pay</div>
  </div>
  <div class="end">

    <p>Which one are you?<br><span>Your limits depend on it.</span></p>
  </div>
  <div class="foot"><span class="sig">nifail</span><span>AI, explained / 04</span></div>
